<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ReUsa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="titulo">Login - ReUsa</h1>

    <form action="principal.html" method="get">
      <label class="rotulo" for="email">E-mail:</label><br />
      <input
        class="campo"
        type="email"
        id="email"
        name="email"
        placeholder="Insira um e-mail válido"
        required
      /><br />

      <label class="rotulo" for="senha">Senha:</label><br />
      <input
        class="campo"
        type="password"
        id="senha"
        name="senha"
        required
      /><br />

      <br />
      <input type="submit" value="Enviar" />
    </form>
  </body>
</html>
